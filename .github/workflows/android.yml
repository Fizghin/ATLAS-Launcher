name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon --refresh-dependencies :app:assembleDebug --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" ATLAS-preview-debug.apk
          if gh release view atlas-preview >/dev/null 2>&1; then
            gh release upload atlas-preview ATLAS-preview-debug.apk --clobber
          else
            gh release create atlas-preview ATLAS-preview-debug.apk --title "ATLAS Preview (unstable)" --notes "Experimental Android launcher. Download the debug APK. This preview is not a finished 3D game world." --prerelease --target "$GITHUB_SHA"
          fi
